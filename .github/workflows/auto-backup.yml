# GitHub Actions - 每日自动提交备份
# 每天 23:00 自动 commit + push 当日所有变更
# 确保你的代码改动不会丢失

name: Daily Auto Backup

on:
  schedule:
    # 每天北京时间 23:00 (UTC 15:00) 自动执行
    - cron: '0 15 * * *'
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "AI Knowledge Hub Bot"
          git config user.email "actions@github.com"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "chore: daily auto backup - ${TIMESTAMP}

          Auto-committed by GitHub Actions
          Timestamp: ${TIMESTAMP}"
          git push origin HEAD
          echo "Backup pushed successfully."

      - name: No changes
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No changes to commit."
