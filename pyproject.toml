[project]
name = "ai-knowledge-hub"
version = "1.0.0"
description = "个人AI知识中台 - Obsidian + Ollama + GitHub + WeChat"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # 行长度由格式化处理

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
